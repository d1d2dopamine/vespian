name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fails the build if any text file contains the replacement character,
      # the diamond with a question mark shown when a letter was mangled by a
      # wrong encoding. Broken letters only ever appear in the built app, long
      # after the edit that caused them, so they are caught here instead.
      - name: Check for broken characters
        run: |
          if grep -rlP '\xEF\xBF\xBD' --include='*.kt' --include='*.xml' --include='*.md' . ; then
            echo "::error::Files above contain a replacement character (mangled letters). Re-save them as UTF-8."
            exit 1
          fi

      # An apostrophe inside a string resource has to be written as \' or the
      # resource compiler refuses the whole file. The error it prints talks
      # about unicode escapes and names the wrong thing, which cost a build to
      # work out, so it is caught here in one line instead.
      - name: Check for unescaped apostrophes in strings
        run: |
          if grep -rnP "<string[^>]*>[^<]*(?<!\\\\)'" app/src/main/res --include='strings.xml' ; then
            echo "::error::Lines above contain an unescaped apostrophe in a string resource. Write it as \\'."
            exit 1
          fi

      # Static checks that need no Android SDK, so they answer in seconds
      # instead of after a six-minute Gradle build. In order: the library never
      # draws its own geometry inside the Material shim and the app has no
      # circles left, the app is wired to resources that exist, the library
      # tests match the library signatures, no nullable slot is passed where a
      # value is required, and the public surface is the one that was reviewed.
      - name: Design and wiring checks
        run: |
          python3 tools/check-design.py
          python3 tools/check-app-wiring.py
          python3 tools/check-tests.py
          python3 tools/check-semantics-and-nullables.py
          python3 tools/dump-api.py --check

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Release, not debug. Same signing key, so it installs straight over the
      # previous build, but Compose and Kotlin are compiled with optimisations
      # on. Debug builds recompose far slower, which is what made switching
      # screens visibly stall.
      # Before the APK, because a build that compiles and lies is worse than
      # one that fails. Cheap enough to run on every push.
      - name: Unit tests
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vespian-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
